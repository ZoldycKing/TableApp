services:
  postgres:
    image: postgres:17-alpine
    container_name: tableapp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tableapp
      POSTGRES_PASSWORD: tableapp
      POSTGRES_DB: tableapp
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tableapp"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    build:
      context: ./infra/minio
    container_name: tableapp-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: tableapp
      MINIO_ROOT_PASSWORD: tableapp123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  # Антивирус для проверки загрузок. Приложение ходит в clamd по TCP
  # (CLAMAV_HOST=127.0.0.1:3310). Первый запуск долго качает базы сигнатур.
  # Без этого сервиса загрузка работает, но сканирование пропускается с
  # предупреждением в логах — см. docs/secure-uploads.md.
  clamav:
    image: clamav/clamav:1.4
    container_name: tableapp-clamav
    restart: unless-stopped
    ports:
      - "3310:3310"
    volumes:
      - clamavdata:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "echo PING | nc -w 3 127.0.0.1 3310 | grep -q PONG"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

  # Почтовый приёмник для разработки.
  #
  # Ловит письма и показывает их в браузере на localhost:8025, наружу
  # не отправляя ничего. Нужен, чтобы проверять сами письма — вёрстку,
  # тему, читаемость кода — не трогая настоящий ящик и не рассылая
  # тестовые письма живым людям.
  #
  # В рабочем виде его нет: там SMTP_URL указывает на настоящего провайдера.
  mailpit:
    image: axllent/mailpit:latest
    container_name: tableapp-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  pgdata:
  miniodata:
  clamavdata:
